mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
secret: ""

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 8.8.8.8

proxies:
  - name: "DIRECT_NODE"
    type: direct
    udp: true

proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - DIRECT
      - DIRECT_NODE

  - name: "AUTO_TEST"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - DIRECT
      - DIRECT_NODE

rules:
  - MATCH,DIRECT
