services:
  biteclash-gateway:
    image: ghcr.io/bitkoala/biteclash-gateway:latest
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: biteclash-gateway
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/etc/biteclash
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
