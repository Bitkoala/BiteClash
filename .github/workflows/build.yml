name: Build & Release BiteClash Client

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. 编译 Windows 桌面原生端 (.exe + 绿色完整包 .zip)
  # -----------------------------------------------------------
  build-windows:
    name: Build Windows Desktop (BiteClash)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Ensure Mihomo Core Binary
        shell: pwsh
        run: |
          if (!(Test-Path "core/windows/mihomo.exe")) {
            New-Item -ItemType Directory -Force -Path "core/windows"
            $url = "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-windows-amd64-v1.19.31.zip"
            curl.exe -L -o "core/windows/mihomo.zip" $url
            tar.exe -xf "core/windows/mihomo.zip" -C "core/windows"
            Get-ChildItem "core/windows" -Filter "*.exe" | Rename-Item -NewName "mihomo.exe" -Force
            Remove-Item "core/windows/mihomo.zip" -ErrorAction SilentlyContinue
          }

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile Windows Release
        working-directory: app
        run: flutter build windows --release

      - name: Package Windows Bundle
        shell: pwsh
        run: |
          $distDir = "BiteClash-windows-x64"
          New-Item -ItemType Directory -Force -Path "$distDir/core/windows", "$distDir/core/configs"
          
          # 复制 Flutter 编译产物
          Copy-Item -Path "app/build/windows/x64/runner/Release/*" -Destination $distDir -Recurse
          
          # 注入 Mihomo 内核、Wintun 网卡驱动与默认配置
          Copy-Item -Path "core/windows/mihomo.exe" -Destination "$distDir/core/windows/"
          if (Test-Path "core/windows/wintun.dll") {
            Copy-Item -Path "core/windows/wintun.dll" -Destination "$distDir/core/windows/"
            Copy-Item -Path "core/windows/wintun.dll" -Destination "$distDir/"
          }
          Copy-Item -Path "core/configs/default_config.yaml" -Destination "$distDir/core/configs/"
          
          # 打包为 zip
          Compress-Archive -Path "$distDir/*" -DestinationPath "BiteClash-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiteClash-windows-x64
          path: BiteClash-windows-x64.zip

  # -----------------------------------------------------------
  # 2. 编译 Android 安装包 (.apk)
  # -----------------------------------------------------------
  build-android:
    name: Build Android APK (BiteClash)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Prepare APK Output
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk BiteClash-android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiteClash-android
          path: BiteClash-android.apk

  # -----------------------------------------------------------
  # 3. 自动发布至 GitHub Releases (自动支持 Tag 或主分支持续发布)
  # -----------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-android.result == 'success'

    steps:
      - name: Download Windows Bundle
        uses: actions/download-artifact@v4
        with:
          name: BiteClash-windows-x64

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: BiteClash-android

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=BiteClash Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=BiteClash Latest Build" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            BiteClash-windows-x64.zip
            BiteClash-android.apk
